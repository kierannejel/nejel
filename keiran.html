
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <h3 id="formTitle">Add Student</h3>

    <form id="studentForm">
        <input type="text" id="studentId"
            placeholder="Student ID" required>

        <input type="text" id="studentName"
            placeholder="Full Name" required>

        <input type="number" id="studentAge"
            placeholder="Age" min="1" max="120" required>

        <select id="studentCourse" required>
            <option value="">Select Course</option>
            <option value="BSIS">BSIS</option>
            <option value="BSIT">BSIT</option>
            <option value="BSCS">BSCS</option>
            <option value="BSAIS">BSAIS</option>
        </select>

        <button type="submit" id="saveBtn">Add Student</button>
        <button type="button" id="cancelBtn" hidden>
            Cancel Edit
        </button>
    </form>

    <h3>Student List</h3>

    <input type="search" id="searchInput"
        placeholder="Search by ID, name, or course...">

    <p id="studentCount">Total Students: 0</p>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Full Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <p id="emptyMessage">No students added yet.</p>
</div>

<script>
    const studentForm = document.querySelector("#studentForm");
    const studentId = document.querySelector("#studentId");
    const studentName = document.querySelector("#studentName");
    const studentAge = document.querySelector("#studentAge");
    const studentCourse = document.querySelector("#studentCourse");
    const studentTable = document.querySelector("#studentTable");
    const studentCount = document.querySelector("#studentCount");
    const searchInput = document.querySelector("#searchInput");
    const emptyMessage = document.querySelector("#emptyMessage");
    const saveBtn = document.querySelector("#saveBtn");
    const cancelBtn = document.querySelector("#cancelBtn");
    const formTitle = document.querySelector("#formTitle");

    let students = [];
    let editingId = null;

    function renderStudents() {
        studentTable.replaceChildren();

        const search = searchInput.value.toLowerCase();

        const filteredStudents = students.filter(student =>
            student.id.toLowerCase().includes(search) ||
            student.name.toLowerCase().includes(search) ||
            student.course.toLowerCase().includes(search)
        );

        filteredStudents.forEach(student => {
            const row = document.createElement("tr");

            [
                student.id,
                student.name,
                student.age,
                student.course
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit";
            editButton.type = "button";
            editButton.addEventListener("click", () => {
                editStudent(student.id);
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.type = "button";
            deleteButton.addEventListener("click", () => {
                deleteStudent(student.id);
            });

            actions.append(editButton, deleteButton);
            row.appendChild(actions);
            studentTable.appendChild(row);
        });

        studentCount.textContent =
            "Total Students: " + students.length;

        emptyMessage.hidden = filteredStudents.length > 0;
        if (filteredStudents.length === 0) {
            emptyMessage.textContent = students.length === 0
                ? "No students added yet."
                : "No matching students found.";
        }
    }

    studentForm.addEventListener("submit", event => {
        event.preventDefault();

        const id = studentId.value.trim();
        const name = studentName.value.trim();
        const age = Number(studentAge.value);
        const course = studentCourse.value;

        if (!id || !name || !course || age < 1 || age > 120) {
            alert("Please enter valid student information.");
            return;
        }

        const duplicate = students.some(student =>
            student.id.toLowerCase() === id.toLowerCase() &&
            student.id !== editingId
        );

        if (duplicate) {
            alert("This Student ID already exists.");
            return;
        }

        if (editingId !== null) {
            const student = students.find(s => s.id === editingId);
            if (student) {
                student.name = name;
                student.age = age;
                student.course = course;
            }
        } else {
            students.push({ id, name, age, course });
        }

        resetForm();
        renderStudents();
    });

    function editStudent(id) {
        const student = students.find(s => s.id === id);
        if (!student) return;

        editingId = id;
        studentId.value = student.id;
        studentId.disabled = true;
        studentName.value = student.name;
        studentAge.value = student.age;
        studentCourse.value = student.course;

        formTitle.textContent = "Edit Student";
        saveBtn.textContent = "Save Changes";
        cancelBtn.hidden = false;

        studentForm.scrollIntoView({ behavior: "smooth" });
    }

    function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        students = students.filter(student => student.id !== id);

        if (editingId === id) {
            resetForm();
        }

        renderStudents();
    }

    function resetForm() {
        studentForm.reset();
        editingId = null;
        studentId.disabled = false;
        formTitle.textContent = "Add Student";
        saveBtn.textContent = "Add Student";
        cancelBtn.hidden = true;
    }

    cancelBtn.addEventListener("click", resetForm);
    searchInput.addEventListener("input", renderStudents);

    renderStudents();
</script>


</body>
</html>

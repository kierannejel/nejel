<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSIS Student Registration</title>

    <style>
        body {
            text-align: center;
            margin: 0;
            padding: 20px 0 60px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffaeeb 0%, #ff6fcf 100%);
            background-attachment: fixed;
            color: antiquewhite;
        }

        h1,
        h2 {
            color: aliceblue;
            text-shadow: 1px 1px 3px rgba(151, 11, 11, 0.4);
        }

        img {
            width: 250px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        table {
            background: #ffffff;
            color: #222;
            border-collapse: collapse;
            margin: 0 auto 30px;
            box-shadow: 0 4px 12px rgba(20, 0, 0, 0.3);
        }

        th,
        td {
            padding: 10px 20px;
            border: 1px solid #555;
        }

        th {
            background-color: #ff6fcf;
            color: white;
        }

        form {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 25px;
            width: 400px;
            max-width: 90%;
            margin: auto;
            border-radius: 10px;
        }

        input,
        select,
        textarea {
            margin: 5px;
            padding: 7px;
        }

        textarea {
            width: 250px;
            height: 80px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>

    <link rel="stylesheet" href="bsis 1-3.css">
</head>

<body>

    <h1>BSIS Student Registration</h1>

    <img src="c:\Users\PC-36\Pictures\Roblox\RobloxScreenShot20250818_142207792.png"
         alt="Student image">

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Year</th>
        </tr>

        <tr>
            <td>01</td>
            <td>Kieran</td>
            <td>1st</td>
        </tr>
    </table>

    <h2>Registration Form</h2>

    <form>

        <label>
            Name:
            <input type="text" name="name">
        </label>

        <br><br>

        <label>
            Email:
            <input type="email" name="email">
        </label>

        <br><br>

        <label>
            Birth Date:
            <input type="date" name="birthdate">
        </label>

        <br><br>

        Gender:
        <label>
            <input type="radio" name="gender" value="male">
            Male
        </label>

        <label>
            <input type="radio" name="gender" value="female">
            Female
        </label>

        <br><br>

        Interest:
        <label>
            <input type="checkbox" name="interest" value="coding">
            Coding
        </label>

        <label>
            <input type="checkbox" name="interest" value="design">
            Design
        </label>

        <br><br>

        <label>
            Year:
            <select name="year">
                <option value="1st">1st Year</option>
                <option value="2nd">2nd Year</option>
                <option value="3rd">3rd Year</option>
                <option value="4th">4th Year</option>
            </select>
        </label>

        <br><br>

        Upload Files:
        <input type="file" name="file">

        <br><br>

        Message:
        <br>
        <textarea name="message"></textarea>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
